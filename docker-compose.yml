version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: calabi-postgres
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Seoul"
      PGTZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - calabi_pg_data:/var/lib/postgresql/data
    networks:
      - calabi-network
  neo4j:
    image: neo4j:5
    container_name: calabi-neo4j
    restart: always
    env_file:
      - .env.dev
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH}"
      TZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:7474:7474" # Browser UI
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - calabi_neo4j_data:/data
      - calabi_neo4j_logs:/logs
    networks:
      - calabi-network
volumes:
  calabi_pg_data:
  calabi_neo4j_data:
  calabi_neo4j_logs:
networks:
  calabi-network:
    driver: bridge

