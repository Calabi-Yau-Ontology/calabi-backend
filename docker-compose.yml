version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: calabi-postgres
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Seoul"
      PGTZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - calabi_pg_data:/var/lib/postgresql/data
    networks:
      - calabi-network
  neo4j:
    image: neo4j:5
    container_name: calabi-neo4j
    restart: always
    env_file:
      - .env.dev
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH}"
      TZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:7474:7474" # Browser UI
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - calabi_neo4j_data:/data
      - calabi_neo4j_logs:/logs
    networks:
      - calabi-network
  redis:
    image: redis:7-alpine
    container_name: calabi-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - calabi_redis_data:/data
    networks:
      - calabi-network
  kafka:
  # Kafka에서 하나의 partition은 하나의 broker에만 할당될 수 있기 때문에, 단일 노드 개발 환경에서는 단일 broker로 충분함
  # partition은 Leader replica, follower replica로 구성되며, Leader replica가 클라이언트의 모든 읽기/쓰기 요청을 처리함
  # follower replica는 Leader replica의 데이터를 복제하여 장애 발생 시 데이터 손실을 방지하고 가용성을 높임
  # 단일 노드 개발 환경에서는 복제이 필요 없으므로, partition 수를 1로 설정하는 것이 일반적
    image: apache/kafka:4.1.1
    container_name: calabi-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1 # Unique identifier for the Kafka broker
      KAFKA_PROCESS_ROLES: broker,controller # Roles assigned to this node (단일 노드 개발 환경에서의 일반적인 구성이라고 함)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093 # PLAINTEXT: 클라이언트 연결용, CONTROLLER: KRaft controller 간 통신용
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 # 클라이언트가 브로커에 연결할 때 사용하는 호스트 및 포트 정보
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # KRaft controller가 사용할 리스너 이름
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT # 각 리스너와 보안 프로토콜 매핑
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093" # KRaft controller 투표자 설정 (controller quorum 구성, node_id@host:port) -> 단일 노드라서 자기 자신만
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # 내부 토픽 복제 계수 설정 (단일 노드 개발 환경(단일 브로커 환경)에서는 1로 설정)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # 트랜잭션 상태 로그 복제 계수 설정 (단일 노드 개발 환경에서는 1로 설정)
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # 트랜잭션 상태 로그의 최소 ISR 설정 (단일 노드 개발 환경에서는 1로 설정 / ISR이란 in-sync replicas로, Leader와 동기화된 복제본을 의미)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # consumer group의 초기 리밸런스 지연 시간 설정 (기본값은 3000ms, 0으로 설정하면 컨슈머가 즉시 파티션 할당을 시작) -> 개발 환경이라 빠른 테스트를 위해 0으로 설정
      KAFKA_NUM_PARTITIONS: 3 # 기본 파티션 수 설정 (토픽 생성 시 기본값으로 사용)
    networks:
      - calabi-network
volumes:
  calabi_pg_data:
  calabi_neo4j_data:
  calabi_neo4j_logs:
  calabi_redis_data:
  calabi-kafka_data:
networks:
  calabi-network:
    driver: bridge

